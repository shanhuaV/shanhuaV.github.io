<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      line-height: 1.6;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #222;
    }

    .title {
      font-size: 18px;
      color: #666;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 30px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 15px;
      color: #222;
      border-left: 4px solid #007bff;
      padding-left: 10px;
    }

    p {
      margin-bottom: 10px;
      font-size: 16px;
    }

    a {
      color: #007bff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .links {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .link-item {
      padding: 8px 16px;
      background: #f1f3f5;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>你的名字</h1>
    <div class="title">个人简介 / 研究方向 / 座右铭</div>

    <div class="section">
      <h2>关于我</h2>
      <p>这里写你的自我介绍，比如专业、研究方向、兴趣爱好等。</p>
      <p>热爱技术，喜欢开源，持续学习中。</p>
    </div>

    <div class="section">
      <h2>项目与作品</h2>
      <p>👉 <a href="https://github.com/你的用户名" target="_blank">GitHub</a></p>
      <p>这里可以放你的项目介绍、论文、博客等。</p>
    </div>

    <div class="section">
      <h2>联系方式</h2>
      <div class="links">
        <div class="link-item">邮箱：your@email.com</div>
        <div class="link-item"><a href="https://github.com/你的用户名" target="_blank">GitHub</a></div>
        <div class="link-item"><a href="#" target="_blank">知乎/博客</a></div>
      </div>
    </div>
  </div>
</body>
</html>
